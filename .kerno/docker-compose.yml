services:
  postgres:
    image: "postgres:16-alpine"
    pull_policy: missing
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    environment:
      - "POSTGRES_USER=test_user"
      - "POSTGRES_PASSWORD=test_password"
      - "POSTGRES_DB=test_db"
    ports:
      - "5432"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U test_user -d test_db"
      interval: "3s"
      timeout: "5s"
      retries: "10"
    tmpfs:
      - /var/lib/postgresql/data
    labels:
      - external-url=postgresql://localhost:{{PORT}}/test_db?user=test_user&password=test_password

  sut:
    build:
      context: ${BUILD_CONTEXT}
      dockerfile_inline: |
        # Multi-stage Dockerfile for FastAPI application with Python 3.13

        # Build stage
        FROM python:3.13-slim AS builder

        # Set working directory
        WORKDIR /app

        # Install build dependencies
        RUN apt-get update && \
            apt-get install -y --no-install-recommends \
            gcc \
            g++ \
            libpq-dev \
            && rm -rf /var/lib/apt/lists/*

        # Copy project files
        COPY . .

        # Install the package and dependencies
        RUN pip install --no-cache-dir --upgrade pip && \
            pip install --no-cache-dir -e .

        # Runtime stage
        FROM python:3.13-slim

        # Set working directory
        WORKDIR /app

        # Install runtime dependencies
        RUN apt-get update && \
            apt-get install -y --no-install-recommends \
            libpq5 \
            && rm -rf /var/lib/apt/lists/*

        # Copy installed packages from builder
        COPY --from=builder /usr/local/lib/python3.13/site-packages /usr/local/lib/python3.13/site-packages
        COPY --from=builder /usr/local/bin /usr/local/bin

        # Copy application source
        COPY --from=builder /app/src /app/src
        COPY --from=builder /app/pyproject.toml /app/pyproject.toml

        # Copy configuration files (if they exist)
        COPY --from=builder /app/config /app/config

        # Create non-root user for security
        RUN useradd -m -u 1000 appuser && \
            chown -R appuser:appuser /app

        USER appuser

        # Set environment variables
        ENV PYTHONUNBUFFERED=1
        ENV PYTHONDONTWRITEBYTECODE=1
        ENV PYTHONPATH=/app/src

        # Expose port for FastAPI/Uvicorn
        EXPOSE 8000

        # Run the application with Uvicorn
        # Using uvloop for better performance as specified in dependencies
        CMD ["python", "-m", "app.run"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000"
    labels:
      - jwt-signing-config=HS256:this_is_a_secret_meeting_all_requirements_of_any_hs_algorithms
